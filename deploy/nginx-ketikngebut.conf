# Potongan setelan Nginx untuk situs KetikNgebut di aaPanel.
# Tempel di DALAM blok `server { ... }` situs Anda (aaPanel: Website > situs > Conf),
# misalnya tepat di bawah baris `root ...;`. Simpan, lalu aaPanel akan memuat ulang Nginx.

# Header keamanan (berlaku untuk semua respons situs ini).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

# API: /api/... diteruskan ke backend .NET (awalan /api dibuang oleh garis miring di akhir proxy_pass).
# `^~` membuat aturan ini selalu menang atas aturan regex bawaan aaPanel (cache gambar/js/css).
location ^~ /api/ {
    proxy_pass http://127.0.0.1:5288/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 512k;
}

# Berkas hasil build Vite punya nama berisi hash, jadi aman di-cache lama.
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}

# index.html selalu dicek ulang agar pemain langsung mendapat versi terbaru setelah update.
location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}

location / {
    try_files $uri $uri/ /index.html;
}
